<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Go + WebView2 Demo</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <main class="card">
    <h1>Go + WebView2 Demo</h1>

  <script src="/app.js"></script>

</html>
